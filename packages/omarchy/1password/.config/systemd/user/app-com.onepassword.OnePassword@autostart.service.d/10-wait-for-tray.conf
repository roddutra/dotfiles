[Service]
# 1Password registers its tray icon once at launch and never retries. At login
# it can start before the Omarchy bar's tray is ready and end up with no icon.
# Wait for the tray, but launch anyway after 30 seconds. See docs/omarchy.md.
ExecStartPre=-/usr/bin/gdbus wait --session --timeout 30 org.kde.StatusNotifierWatcher
