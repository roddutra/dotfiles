# Tuned for remote desktop work rather than game streaming.
# Sunshine's web UI rewrites this file in place, so changes made there show up in git.

# Use connector names; Sunshine's numeric display ids can change between boots.
output_name = DP-1

# Hyprland's wlr-screencopy needs no portal picker, which nobody could answer mid-session.
capture = wlr

# Desktop text needs more quality per bit than games do; the RTX 3070 Ti has headroom for it.
nvenc_preset = 4
nvenc_twopass = full_res
nvenc_spatial_aq = enabled
