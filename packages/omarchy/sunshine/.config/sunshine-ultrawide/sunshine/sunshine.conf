# Second Sunshine host for the Dell ultrawide. sunshine-ultrawide.service points
# Sunshine here, so pairings, credentials and logs stay separate from the main host.
# Keep the tuning below in step with ~/.config/sunshine/sunshine.conf.

sunshine_name = omarchy-ultrawide
output_name = DP-2

# 100 above the default 47989; every derived port shifts with it (web UI on 48090).
port = 48089

# The main host already shows a tray icon.
system_tray = disabled

capture = wlr
nvenc_preset = 4
nvenc_twopass = full_res
nvenc_spatial_aq = enabled
