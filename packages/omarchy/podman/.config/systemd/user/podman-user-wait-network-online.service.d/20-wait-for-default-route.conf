[Service]
# Rootless Podman builds its network namespace (pasta) when the first container
# starts, copying the host's routes at that moment, and never picks up a route
# that appears later. Lerd's 10-lerd-no-network-wait.conf turns this wait into
# /bin/true, so at login the containers can start before DHCP finishes and stay
# offline until every container is restarted. Wait up to 30 seconds for an IPv4
# default route instead, then start the containers anyway.
# See docs/omarchy.md "Containers have no internet after boot".
ExecStart=
ExecStart=-/usr/bin/timeout 30 /bin/sh -c 'until ip -4 route show default | grep -q .; do sleep 0.5; done'
TimeoutStartSec=40s
