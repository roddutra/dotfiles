## Connect the Bose Revolve SoundLink only on request.
## Omarchy's bluetooth-a2dp-autoconnect.conf makes PipeWire reconnect A2DP to
## every paired, trusted device whenever the adapter appears, which happens at
## boot and after every wake. An empty list turns that off for this speaker
## only. Connecting from the Bluetooth panel still works. This file must sort
## after bluetooth-a2dp-autoconnect.conf so its rule wins.

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "bluez_card.60_AB_D2_31_52_42"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ ]
      }
    }
  }
]
