[Service]
# Claude Desktop (Electron) looks for the tray once at launch. If the Omarchy
# bar's tray is not up yet, it falls back to a GTK icon the bar cannot show and
# never retries. Wait for the tray, but launch anyway after 30 seconds. See
# docs/omarchy.md.
ExecStartPre=-/usr/bin/gdbus wait --session --timeout 30 org.kde.StatusNotifierWatcher
