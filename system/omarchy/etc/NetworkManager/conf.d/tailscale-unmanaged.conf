# tailscaled configures tailscale0 and its DNS itself. While NetworkManager
# manages it, every boot sends an "up" event to dispatcher hooks, and lerd's
# 99-lerd-dns hook then replaces MagicDNS on tailscale0 with lerd's dnsmasq,
# so tailnet names stop resolving until Tailscale reconnects. "+=" appends to
# lerd-dns-link.conf's lerd0 entry; a plain "=" would replace it.
[keyfile]
unmanaged-devices+=interface-name:tailscale0
