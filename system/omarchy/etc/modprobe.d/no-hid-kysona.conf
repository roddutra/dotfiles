# Keep the VXE NordicMouse dongle (3554:f58a) on hid-generic. hid_kysona polls
# the mouse's battery every 5 seconds and does not pause for sleep. When a wake
# resets the USB controller, a poll can land mid-reset and crash the controller
# driver, freezing every USB device and the resume with it. The mouse works
# without it; only its unused battery reading is lost. See "Waking from sleep
# hangs with no display" in docs/omarchy.md.
blacklist hid_kysona
